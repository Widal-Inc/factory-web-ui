name: Release
# Installs discover Git tags directly. Never create a tag until its exact commit passes CI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already merged into main (X.Y.Z, without v)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ${{ vars.CI_SELF_HOSTED_LABELS && fromJSON(vars.CI_SELF_HOSTED_LABELS) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Validate version, notes and unused tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bun scripts/release-notes.ts "$RELEASE_VERSION"
          # the remote-vN this version names is published from this tree, and the Worker deploy is recorded
          bun scripts/release-guards.ts --release "$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo 'This version already has a tag; choose a new version.' >&2
            exit 1
          fi
  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
  # the Rust PTY host for Linux and macOS, attached when the release is created: installs read it by tag.
  # Its attest job signs each binary's build provenance, which needs these permissions.
  pty-sidecar:
    needs: preflight
    uses: ./.github/workflows/pty-sidecar.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      ref: ${{ github.sha }}
  publish:
    needs: [validate, pty-sidecar]
    runs-on: ${{ vars.CI_SELF_HOSTED_LABELS && fromJSON(vars.CI_SELF_HOSTED_LABELS) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ovis-pty-sidecar
          path: ${{ runner.temp }}/pty-sidecar
      # The checkout keeps no Git credential: the repository is public, so the fetch below reads it
      # anonymously, and gh authenticates with GH_TOKEN alone.
      - name: Publish the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          bun scripts/release-notes.ts "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo 'Tag appeared during validation; refusing to publish it.' >&2
            exit 1
          fi
          # shellcheck disable=SC2016 # JavaScript, not shell
          test "$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).version)' "$RUNNER_TEMP/pty-sidecar/ovis-pty-sidecar.json")" = "$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" "$RUNNER_TEMP"/pty-sidecar/* --target "$GITHUB_SHA" --title "Ovis v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest=false
  # after desktop: either app job may make the release latest, and releases/latest/download must then
  # hold the desktop installers and feeds too; a failed desktop job holds them back until it is rerun
  windows-app:
    needs: [publish, desktop]
    uses: ./.github/workflows/windows-app.yml
    with:
      tag: v${{ inputs.version }}
    permissions:
      contents: write
  # the desktop app (app/electron): AppImages, dmg and zip, and the feed files it updates from
  desktop:
    needs: publish
    uses: ./.github/workflows/desktop.yml
    with:
      tag: v${{ inputs.version }}
    secrets:
      MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
      MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
      MAC_NOTARY_KEY_P8: ${{ secrets.MAC_NOTARY_KEY_P8 }}
      MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
      MAC_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    permissions:
      contents: write
  mac-dmg:
    needs: [publish, desktop]
    uses: ./.github/workflows/mac-dmg.yml
    with:
      tag: v${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
